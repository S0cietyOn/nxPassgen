<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #24243e, #141421 55%, #090911);
      color: white;
    }

    .app {
      width: 420px;
      max-width: 92vw;
      padding: 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .sub {
      margin: 0 0 22px;
      color: rgba(255,255,255,.66);
      font-size: 14px;
    }

    .password-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #password {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.32);
      color: #fff;
      font-family: Consolas, monospace;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 14px;
      background: #7c5cff;
      color: white;
      font-weight: 700;
      transition: .14s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.secondary {
      background: rgba(255,255,255,.14);
    }

    .section {
      margin: 16px 0;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: rgba(255,255,255,.86);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #7c5cff;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.84);
      font-size: 14px;
      user-select: none;
    }

    input[type="checkbox"] {
      accent-color: #7c5cff;
      width: 16px;
      height: 16px;
    }

    .generate {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      font-size: 15px;
    }

    .hint {
      margin-top: 12px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      line-height: 1.45;
    }

    .toast {
      height: 20px;
      margin-top: 12px;
      text-align: center;
      color: #b7ffcf;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Password Generator</h1>
    <p class="sub">Offline, secure, one-file generator.</p>

    <div class="password-row">
      <input id="password" readonly />
      <button class="secondary" onclick="copyPassword()">Copy</button>
    </div>

    <div class="section">
      <div class="label-row">
        <span>Length</span>
        <strong id="lengthValue">20</strong>
      </div>
      <input id="length" type="range" min="8" max="64" value="20" oninput="updateLength()" />
    </div>

    <div class="section checks">
      <label><input id="upper" type="checkbox" checked /> Uppercase</label>
      <label><input id="lower" type="checkbox" checked /> Lowercase</label>
      <label><input id="numbers" type="checkbox" checked /> Numbers</label>
      <label><input id="symbols" type="checkbox" checked /> Symbols</label>
    </div>

    <button class="generate" onclick="generatePassword()">Generate Password</button>

    <p class="hint">
      Uses your browser's crypto system. Nothing is uploaded or saved.
    </p>

    <div class="toast" id="toast"></div>
  </main>

  <script>
    const sets = {
      upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      lower: "abcdefghijklmnopqrstuvwxyz",
      numbers: "0123456789",
      symbols: "!@#$%^&*()-_=+[]{};:,.<>?/|~"
    };

    function secureRandom(max) {
      const array = new Uint32Array(1);
      let value;
      do {
        crypto.getRandomValues(array);
        value = array[0];
      } while (value >= Math.floor(0xFFFFFFFF / max) * max);
      return value % max;
    }

    function pick(str) {
      return str[secureRandom(str.length)];
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = secureRandom(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateLength() {
      document.getElementById("lengthValue").textContent = document.getElementById("length").value;
      generatePassword();
    }

    function generatePassword() {
      const length = Number(document.getElementById("length").value);
      const selected = [];

      if (document.getElementById("upper").checked) selected.push(sets.upper);
      if (document.getElementById("lower").checked) selected.push(sets.lower);
      if (document.getElementById("numbers").checked) selected.push(sets.numbers);
      if (document.getElementById("symbols").checked) selected.push(sets.symbols);

      if (selected.length === 0) {
        document.getElementById("password").value = "Select at least one option";
        return;
      }

      const all = selected.join("");
      const password = [];

      selected.forEach(set => password.push(pick(set)));

      while (password.length < length) {
        password.push(pick(all));
      }

      document.getElementById("password").value = shuffle(password).join("");
    }

    async function copyPassword() {
      const password = document.getElementById("password").value;
      if (!password || password === "Select at least one option") return;

      await navigator.clipboard.writeText(password);

      const toast = document.getElementById("toast");
      toast.textContent = "Copied.";
      setTimeout(() => toast.textContent = "", 1200);
    }

    document.querySelectorAll("input[type='checkbox']").forEach(box => {
      box.addEventListener("change", generatePassword);
    });

    generatePassword();
  </script>
</body>
</html>
